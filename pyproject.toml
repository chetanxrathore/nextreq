[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "nextreq"
description = "A next-generation, Rust-powered, batteries-included HTTP client for Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
keywords = ["http", "client", "async", "rust", "sse", "websocket", "http2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
pydantic = ["pydantic>=2.0"]
msgspec = ["msgspec>=0.18"]
otel = ["opentelemetry-api>=1.20"]
dev = [
    "maturin>=1.14",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "pydantic>=2.0",
    "msgspec>=0.18",
    "fastapi>=0.110",
    "flask>=3.0",
    "requests>=2.31",
    "types-requests",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "trustme>=1.1",
    "hypercorn>=0.17",
    "brotli>=1.1",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "typing_extensions>=4.8",
]

[project.urls]
Repository = "https://github.com/nextreq/nextreq"

[tool.maturin]
python-source = "python"
module-name = "nextreq._nextreq"
bindings = "pyo3"
include = [{ path = "LICENSE-*", format = "sdist" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["python", "tests", "benches"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF", "PIE", "PERF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "SIM105",  # contextlib.suppress is slower than try/except on hot paths
    "PERF203", # try/except in loops is intentional (and free on 3.11+)
    "UP007",   # runtime type aliases with forward references need typing.Union on 3.10
]

[tool.ruff.lint.per-file-ignores]
# Nested `with` blocks read better in tests (client scope vs. assertion scope).
"tests/*" = ["SIM117", "B017", "PT011", "PERF401"]

[tool.ruff.lint.isort]
known-first-party = ["nextreq"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
mypy_path = "python"
