name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test

  http3:
    name: Rust (http3 feature compiles)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg reqwest_unstable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: http3
      - run: cargo check --features http3

  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create virtualenv and install dev dependencies
        # --clear makes this step work whether or not a .venv already exists
        # (older setup-uv releases created one when python-version was set).
        run: |
          uv venv --clear
          uv pip install -e ".[dev]"
      - name: Build extension (release)
        run: uv run --no-sync maturin develop --release
      - name: ruff
        run: uv run --no-sync ruff check python tests benches
      - name: ruff format
        run: uv run --no-sync ruff format --check python tests benches
      - name: mypy
        run: uv run --no-sync mypy --strict python/nextreq tests/test_typing.py
      - name: pytest
        run: uv run --no-sync pytest -v

  bench-smoke:
    name: Benchmark suite (smoke)
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: |
          uv venv --clear
          uv pip install -e ".[dev]"
          uv run --no-sync maturin develop --release
      - name: Run benchmarks (quick mode, results not committed)
        run: uv run --no-sync python benches/run_benchmarks.py --quick --output "$RUNNER_TEMP/RESULTS.md"
