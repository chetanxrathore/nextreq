name: Wheels

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - ".github/workflows/wheels.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # abi3 wheels are built against the oldest supported interpreter and work on
  # every newer CPython, so one wheel per platform is enough.
  ABI3_PYTHON: "3.10"

jobs:
  linux:
    name: manylinux ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.ABI3_PYTHON }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-manylinux-${{ matrix.target }}
          path: dist

  musllinux:
    name: musllinux ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.ABI3_PYTHON }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: musllinux_1_2
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-musllinux-${{ matrix.target }}
          path: dist

  macos:
    name: macOS ${{ matrix.target }}
    # Both architectures build on the current Apple-silicon image. The pinned
    # images used before (macos-13 for Intel, macos-14 for arm64) have been
    # retired by GitHub, so the Intel wheel is cross-compiled instead: maturin
    # adds the x86_64-apple-darwin Rust target and abi3 needs no Intel Python.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.ABI3_PYTHON }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.ABI3_PYTHON }}
          architecture: x64
      - uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-x64
          path: dist

  free-threaded:
    # abi3 cannot be loaded by free-threaded CPython 3.14, so ship a
    # version-specific cp314t wheel. From 3.15 the abi3t (PEP 803) wheel
    # produced by the `abi3t-py315` feature covers both builds.
    name: free-threaded cp314t (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14t"
      - uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist --interpreter python3.14t
          manylinux: "2_28"
          sccache: "true"
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-cp314t-${{ matrix.os }}
          path: dist

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  smoke-test:
    name: Install and import wheel (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: [linux, macos, windows]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Install from the built wheels only
        run: python -m pip install --no-index --find-links dist nextreq
      - name: Import
        run: python -c "import nextreq; print(nextreq.__version__)"

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, musllinux, macos, windows, free-threaded, sdist, smoke-test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing + signing the provenance attestations
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      # PyPA's publisher (rather than `maturin upload`) because it generates a
      # signed PEP 740 provenance attestation for every file, which is what
      # PyPI shows as "provenance" and what lets users verify that a wheel was
      # built by this workflow from this repository.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          attestations: true
          skip-existing: true
